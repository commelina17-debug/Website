<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intermediate CSS Ex-1</title>
    <style>
        .container{
            border: 3px solid black;
            width: 600px;
            height: 500px;
            margin: 10px;
            margin-top: 20px;;

        }
        div:first-child{
            margin-left:10px;
            margin-top:10px;
        }
        div:nth-child(2){
            margin-left: 530px;
            margin-top: -20px;
        }
        div:nth-child(3){
            position: relative;
            top: 35%;
            left: 45%;
        }
        div:nth-child(4){
            margin-left: 10px;
            margin-top: 420px;
        }
        div:last-child{
            margin-left : 500px;
            margin-top: -20px;
        }
    </style>  
</head> 

<body>
    <div class="container">
        <div>top left</div>
        <div>top right</div>
        <div>center</div>
        <div>bottom left</div>
        <div>bottom right</div>
    </div>
</body>
</html>
