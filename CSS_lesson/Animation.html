<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height:100vh;
        }

        button{
            padding:20px 40px;
            font-size: 30px;
            background: none;
            border:3px solid grey;
            position:relative;
            overflow: hidden;
           
        }

        button::before{
            content:"";
            width:100%;
            height:100%;
            background-color: blueviolet;
            position: absolute;
            top:0;
            left:0;
            transform: translateX(100%);
            z-index:-1;
        }
        button:hover::before{   
        transform: translateY(0%);
        transition: all 1s;
        }
        button:hover{color:yellowgreen;}
    </style>
</head>
<body>

<button>Hover me</button>


</body>
</html>
