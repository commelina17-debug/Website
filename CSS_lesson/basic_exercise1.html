<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic CSS Ex-1</title>
    <style>
        div{
            text-align: center;
            line-height: 100px;
            color: white;
        }
        #one, #five{
            width: 100px;
            height: 100px;
            margin-left: 30px;
            margin-bottom: 30px;
            background-color: red;
        }
        #two, #four{
            width: 100px;
            height: 100px;
            margin-left: 80px;
            margin-bottom: 30px;
            background-color: green;
        }
        #three{
            width: 100px;
            height: 100px;
            margin-bottom: 30px;
            margin-left: 130px;
            background-color: blue;
        }

    </style>
</head>
<body>
    <div id="one">One</div>
    <div id="two">Two</div>
    <div id="three">Three</div>
    <div id="four">Four</div>
    <div id="five">Five</div>
</body>
</html>
